<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="65%">
      <stop offset="0" stop-color="#3a0a22"/>
      <stop offset=".55" stop-color="#16060f"/>
      <stop offset="1" stop-color="#080509"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a5c"/>
      <stop offset=".5" stop-color="#ff5a95"/>
      <stop offset="1" stop-color="#ff2a5c"/>
    </linearGradient>
    <radialGradient id="ball" cx="62%" cy="66%" r="70%" fx="68%" fy="72%">
      <stop offset="0" stop-color="#ff9ae6"/>
      <stop offset=".35" stop-color="#ff5291"/>
      <stop offset=".72" stop-color="#f1204f"/>
      <stop offset="1" stop-color="#a50c36"/>
    </radialGradient>
    <radialGradient id="spec" cx="34%" cy="30%" r="34%">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <g id="mark">
      <path d="M256 108 L402 356 L110 356 Z" fill="none" stroke="url(#beam)" stroke-width="26" stroke-linejoin="round"/>
      <circle cx="256" cy="108" r="60"/>
      <circle cx="402" cy="356" r="60"/>
      <circle cx="110" cy="356" r="60"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- soft pink glow behind the mark -->
  <g filter="url(#glow)" opacity=".85">
    <use href="#mark" fill="#fa1d4c" stroke="#fa1d4c"/>
  </g>
  <!-- beams with a bright core -->
  <path d="M256 108 L402 356 L110 356 Z" fill="none" stroke="url(#beam)" stroke-width="26" stroke-linejoin="round"/>
  <path d="M256 108 L402 356 L110 356 Z" fill="none" stroke="#ffd2df" stroke-opacity=".7" stroke-width="8" stroke-linejoin="round"/>
  <!-- glossy spheres -->
  <g>
    <circle cx="256" cy="108" r="60" fill="url(#ball)"/><circle cx="256" cy="108" r="60" fill="url(#spec)"/>
    <circle cx="402" cy="356" r="60" fill="url(#ball)"/><circle cx="402" cy="356" r="60" fill="url(#spec)"/>
    <circle cx="110" cy="356" r="60" fill="url(#ball)"/><circle cx="110" cy="356" r="60" fill="url(#spec)"/>
  </g>
</svg>
